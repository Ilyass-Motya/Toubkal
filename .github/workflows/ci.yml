name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript/React
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate documentation
        run: npm run validate-docs:strict

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Check coverage threshold
        run: |
          COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below 80% threshold"
            exit 1
          else
            echo "✅ Coverage $COVERAGE% meets 80% threshold"
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-report.json
          retention-days: 30

  cpp-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check C++ formatting
        run: |
          find . -name '*.cc' -o -name '*.h' | xargs clang-format -n --Werror

  build-verification:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['20']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint

      - name: Validate documentation
        run: npm run validate-docs:strict

      - name: Run tests
        run: npm run test:coverage

      - name: Verify build artifacts
        run: |
          echo "✅ All quality gates passed on ${{ matrix.os }}"
          echo "TypeScript: ✅ Strict mode enforced"
          echo "ESLint: ✅ No errors or warnings"
          echo "Tests: ✅ All tests passed with coverage"

  multi-platform-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18', '20', '22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Type check
        run: npx tsc --noEmit

  quality-gate:
    runs-on: ubuntu-latest
    needs: [lint-and-test, cpp-lint, build-verification, multi-platform-test]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.lint-and-test.result }}" != "success" || 
                "${{ needs.cpp-lint.result }}" != "success" || 
                "${{ needs.build-verification.result }}" != "success" || 
                "${{ needs.multi-platform-test.result }}" != "success" ]]; then
            echo "❌ Quality gate failed - one or more jobs failed"
            exit 1
          else
            echo "✅ All quality gates passed"
          fi

      - name: Summary
        run: |
          echo "## 🎉 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ESLint check passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TypeScript type check passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Documentation validation passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Vitest tests with coverage passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ C++ formatting check passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Multi-platform build verification passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Node.js compatibility test passed" >> $GITHUB_STEP_SUMMARY
