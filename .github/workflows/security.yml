name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "🔍 Running dependency vulnerability scan..."
          npm audit --audit-level=moderate --json > audit-report.json || true
          
          # Check for high/critical vulnerabilities
          HIGH_CRITICAL=$(jq '.vulnerabilities | to_entries | map(select(.value.severity == "high" or .value.severity == "critical")) | length' audit-report.json)
          
          if [ "$HIGH_CRITICAL" -gt 0 ]; then
            echo "❌ Found $HIGH_CRITICAL high/critical vulnerabilities"
            npm audit --audit-level=moderate
            exit 1
          else
            echo "✅ No high/critical vulnerabilities found"
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  sast-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint security rules
        run: |
          echo "🔍 Running SAST with ESLint security rules..."
          npx eslint . --ext .ts,.tsx --config eslint.config.js --format json --output-file sast-report.json || true
          
          # Check for security-related errors
          SECURITY_ISSUES=$(jq '[.[] | select(.messages[] | select(.ruleId | contains("security") or contains("no-eval") or contains("no-implied-eval") or contains("no-new-func")))] | length' sast-report.json)
          
          if [ "$SECURITY_ISSUES" -gt 0 ]; then
            echo "❌ Found $SECURITY_ISSUES security-related ESLint issues"
            npx eslint . --ext .ts,.tsx --config eslint.config.js
            exit 1
          else
            echo "✅ No security-related ESLint issues found"
          fi

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-report.json
          retention-days: 30

  license-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check license compliance
        run: |
          echo "🔍 Checking license compliance..."
          
          # Install license checker
          npm install -g license-checker
          
          # Generate license report
          license-checker --json --out license-report.json || true
          
          # Check for problematic licenses
          PROBLEMATIC_LICENSES=$(jq 'to_entries | map(select(.value.licenses | contains("GPL") or contains("AGPL") or contains("Copyleft"))) | length' license-report.json)
          
          if [ "$PROBLEMATIC_LICENSES" -gt 0 ]; then
            echo "❌ Found $PROBLEMATIC_LICENSES packages with problematic licenses"
            echo "Problematic licenses:"
            jq 'to_entries | map(select(.value.licenses | contains("GPL") or contains("AGPL") or contains("Copyleft"))) | .[] | "\(.key): \(.value.licenses)"' license-report.json
            exit 1
          else
            echo "✅ All licenses are compliant"
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.json
          retention-days: 30

  supply-chain-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify package integrity
        run: |
          echo "🔍 Verifying package integrity..."
          
          # Check for package-lock.json
          if [ ! -f "package-lock.json" ]; then
            echo "❌ package-lock.json not found - dependency versions not locked"
            exit 1
          fi
          
          # Verify lock file integrity
          npm ci --prefer-offline --no-audit
          
          echo "✅ Package integrity verified"

      - name: Check for known malicious packages
        run: |
          echo "🔍 Checking for known malicious packages..."
          
          # Install safety checker
          npm install -g @snyk/cli
          
          # Run Snyk security scan
          npx snyk test --json > snyk-report.json || true
          
          # Check for high/critical issues
          HIGH_CRITICAL=$(jq '.vulnerabilities | map(select(.severity == "high" or .severity == "critical")) | length' snyk-report.json)
          
          if [ "$HIGH_CRITICAL" -gt 0 ]; then
            echo "❌ Found $HIGH_CRITICAL high/critical security issues"
            npx snyk test
            exit 1
          else
            echo "✅ No high/critical security issues found"
          fi

      - name: Upload Snyk report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          retention-days: 30

  security-summary:
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast-scan, license-compliance, supply-chain-security]
    if: always()

    steps:
      - name: Check security scan results
        run: |
          if [[ "${{ needs.dependency-scan.result }}" != "success" || 
                "${{ needs.sast-scan.result }}" != "success" || 
                "${{ needs.license-compliance.result }}" != "success" || 
                "${{ needs.supply-chain-security.result }}" != "success" ]]; then
            echo "❌ Security scan failed - one or more security checks failed"
            exit 1
          else
            echo "✅ All security scans passed"
          fi

      - name: Security Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency vulnerability scan passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SAST (Static Application Security Testing) passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ License compliance check passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Supply chain security verification passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Features Verified:" >> $GITHUB_STEP_SUMMARY
          echo "- No high/critical vulnerabilities in dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- No security-related ESLint violations" >> $GITHUB_STEP_SUMMARY
          echo "- All package licenses are compliant" >> $GITHUB_STEP_SUMMARY
          echo "- Package integrity verified (package-lock.json present)" >> $GITHUB_STEP_SUMMARY
