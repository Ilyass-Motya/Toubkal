<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Toubkal Logo -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Mountain Icon -->
  <g id="mountain-icon">
    <!-- Main Mountain Peak -->
    <path d="M20 45 L30 25 L40 45 Z" fill="url(#mountainGradient)" stroke="#1E40AF" stroke-width="1"/>
    <!-- Secondary Peak -->
    <path d="M35 45 L45 30 L55 45 Z" fill="url(#mountainGradient)" stroke="#1E40AF" stroke-width="1"/>
    <!-- Base Mountain -->
    <path d="M15 45 L25 35 L35 45 L45 35 L55 45 L65 45 Z" fill="url(#mountainGradient)" stroke="#1E40AF" stroke-width="1"/>
    <!-- Privacy Shield Overlay -->
    <circle cx="40" cy="35" r="8" fill="none" stroke="#10B981" stroke-width="2"/>
    <path d="M36 35 L39 38 L44 32" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Brand Text -->
  <g id="brand-text">
    <text x="75" y="25" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="url(#logoGradient)">Toubkal</text>
    <text x="75" y="45" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#64748B">Browser</text>
  </g>
  
  <!-- Privacy Indicator -->
  <g id="privacy-indicator">
    <circle cx="180" cy="20" r="6" fill="#10B981"/>
    <path d="M177 20 L179 22 L183 18" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
