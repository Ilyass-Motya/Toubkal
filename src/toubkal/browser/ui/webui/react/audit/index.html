<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/toubkal-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toubkal Audit Dashboard</title>
    <style>
      :root {
        --toubkal-primary: #1E40AF;
        --toubkal-secondary: #3B82F6;
        --toubkal-accent: #10B981;
        --toubkal-bg: #F8FAFC;
        --toubkal-card: #FFFFFF;
        --toubkal-text: #1F2937;
        --toubkal-text-secondary: #6B7280;
        --toubkal-border: #E5E7EB;
        --toubkal-warning: #F59E0B;
        --toubkal-danger: #EF4444;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--toubkal-bg);
        color: var(--toubkal-text);
        line-height: 1.6;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        gap: 1rem;
      }

      .loading h1 {
        color: var(--toubkal-primary);
        font-size: 2rem;
        font-weight: 700;
      }

      .loading p {
        color: var(--toubkal-text-secondary);
        font-size: 1.1rem;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--toubkal-border);
        border-top: 4px solid var(--toubkal-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="spinner"></div>
        <h1>Loading Toubkal Audit Dashboard...</h1>
        <p>Please wait while the application loads.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
